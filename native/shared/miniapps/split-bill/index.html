<!DOCTYPE html>
<html lang="vi" data-mode="miniapp">
<head>
<script src="/host.js"></script>
  <meta charset="UTF-8" />
  <!-- Maximum-scale/user-scalable preserved for a11y: do NOT disable zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chia tiền ăn uống nhóm — offline, quét VietQR, chốt sổ tối thiểu. / Split group bills offline with VietQR settlement." />
  <title>Chia tiền · Split Bill</title>
  <!-- No <meta http-equiv="Content-Security-Policy"> here (B2): CSP is served
       as a response header by the native scheme handler / hosting headers. -->
  <style>
    /* Inline critical CSS — semantic token snapshot only (no host-only
       glass/scrim/shadow). System fonts, 48px targets, AA pairs.
       Mobile-first (mini-app + phone web); desktop adapts via breakpoints. */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--ma-color-canvas, #f4f7fb);
      color: var(--ma-color-text, #162033);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--ma-color-surface, #fff);
      border-bottom: 1px solid var(--ma-color-border, #dce2ec);
    }
    .topbar-inner {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 12px;
      max-width: 1120px; margin: 0 auto; width: 100%;
    }
    .brand { flex: 1; min-width: 0; }
    .brand h1 { font-size: 20px; line-height: 28px; margin: 0; }
    .brand p { margin: 2px 0 0; font-size: 14px; color: var(--ma-color-text-muted, #657085); }
    .badge {
      min-height: 32px; display: inline-flex; align-items: center;
      padding: 4px 10px; border-radius: 999px;
      background: var(--ma-color-action-soft, #e8eaff); color: var(--ma-color-action, #5865f2);
      font-size: 14px; font-weight: 700; white-space: nowrap;
      border: 1px solid var(--ma-color-border, #dce2ec);
    }
    .badge[data-online="false"], .badge[data-mode="memory"] { background: var(--ma-color-surface-raised, #fff); color: var(--ma-color-warning, #9a5b00); border: 1px solid var(--ma-color-warning, #9a5b00); }
    main { padding: 16px; padding-bottom: 96px; max-width: 720px; margin: 0 auto; }
    /* Desktop + website: wider canvas, sidebar steps. */
    html[data-mode="web"] main { max-width: 1120px; }
    .layout { display: block; }
    .steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
    .step {
      min-height: 48px; border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-control, 12px);
      background: var(--ma-color-surface, #fff); color: var(--ma-color-text, #162033);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font: inherit; cursor: pointer;
    }
    .step-n { font-size: 14px; font-weight: 700; color: var(--ma-color-text-muted, #657085); }
    .step-l { font-size: 14px; font-weight: 700; }
    .step.is-active { border-color: var(--ma-color-action, #5865f2); background: var(--ma-color-action-soft, #e8eaff); }
    .step.is-active .step-n, .step.is-active .step-l { color: var(--ma-color-action, #5865f2); }
    .card {
      background: var(--ma-color-surface, #fff); border: 1px solid var(--ma-color-border, #dce2ec);
      border-radius: var(--ma-radius-surface, 16px); padding: 16px; margin-top: 12px;
    }
    .card h2 { font-size: 18px; margin: 0 0 4px; }
    .hint { color: var(--ma-color-text-muted, #657085); font-size: 14px; margin: 0 0 12px; }
    .muted { color: var(--ma-color-text-muted, #657085); font-size: 14px; }
    .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    .row > input, .row > select, .row > textarea { flex: 1; min-width: 0; }
    input, select, textarea {
      min-height: 48px; font: inherit; color: var(--ma-color-text, #162033);
      border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-control, 12px);
      padding: 10px 12px; background: var(--ma-color-surface, #fff); max-width: 100%;
    }
    textarea { min-height: 64px; resize: vertical; }
    :is(button, a, input, select, textarea):focus-visible {
      outline: 3px solid var(--ma-color-focus, #3559e8); outline-offset: 2px;
    }
    input[type="file"] { padding: 12px; }
    .btn {
      min-height: 48px; min-width: 48px; font: inherit; font-weight: 700;
      border-radius: var(--ma-radius-control, 12px); border: 1px solid transparent;
      padding: 10px var(--ma-space-4, 16px); cursor: pointer;
    }
    .btn-primary { background: var(--ma-color-action, #5865f2); color: var(--ma-color-on-action, #fff); }
    .btn-secondary { background: var(--ma-color-action-soft, #e8eaff); color: var(--ma-color-action, #5865f2); }
    .btn-ghost { background: transparent; color: var(--ma-color-action, #5865f2); border-color: var(--ma-color-border, #dce2ec); }
    .btn-small { min-height: 48px; font-size: 14px; padding: 10px 12px; }
    .btn:disabled { background: var(--ma-color-surface-raised, #f4f5f7); color: var(--ma-color-text-muted, #657085); border-color: var(--ma-color-border, #dce2ec); cursor: not-allowed; }
    .list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
    .list-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-control, 12px);
      padding: 10px 10px 10px 12px; min-height: 48px; background: var(--ma-color-surface, #fff);
    }
    .who { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; min-width: 0; }
    .item-actions { display: inline-flex; gap: 6px; flex: none; }
    .empty { border: 1px dashed var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-control, 12px); padding: 16px; color: var(--ma-color-text-muted, #657085); }
    .inline-error { color: var(--ma-color-danger, #c2353f); font-weight: 700; }
    .inline-note[data-kind="error"] { color: var(--ma-color-danger, #c2353f); font-weight: 700; }
    .inline-note[data-kind="ok"] { color: var(--ma-color-success, #16794b); font-weight: 700; }
    .inline-note[data-kind="warn"], .notice { color: var(--ma-color-warning, #9a5b00); font-weight: 600; }
    .inline-note[data-kind="info"] { color: var(--ma-color-text-muted, #657085); }
    .status { border-radius: var(--ma-radius-control, 12px); padding: 12px; margin: 12px 0; display: flex; gap: 12px; align-items: center; }
    .status-loading, .status-offline { background: var(--ma-color-action-soft, #e8eaff); }
    .status-error, .status-unknown { background: var(--ma-color-surface-raised, #fff); border: 1px solid var(--ma-color-danger, #c2353f); }
    .status-permission, .status-rate { background: var(--ma-color-surface-raised, #fff); border: 1px solid var(--ma-color-warning, #9a5b00); }
    .skeleton .sk-line { height: 20px; border-radius: 8px; background: var(--ma-color-border, #dce2ec); margin: 8px 0; }
    .seg { display: flex; gap: 8px; margin: 8px 0; }
    .seg-btn { flex: 1; min-height: 48px; border-radius: var(--ma-radius-control, 12px); border: 1px solid var(--ma-color-border, #dce2ec); background: var(--ma-color-surface, #fff); font: inherit; font-weight: 700; color: var(--ma-color-text-muted, #657085); cursor: pointer; }
    .seg-btn.is-active { background: var(--ma-color-action-soft, #e8eaff); color: var(--ma-color-action, #5865f2); border-color: var(--ma-color-action, #5865f2); }
    .sheet-overlay { position: fixed; inset: 0; background: rgba(22, 32, 51, 0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
    .sheet-overlay[hidden] { display: none; }
    .sheet { background: var(--ma-color-surface-raised, #fff); border-radius: var(--ma-radius-surface, 20px) var(--ma-radius-surface, 20px) 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 720px; max-height: 88vh; overflow: auto; }
    .field { display: grid; gap: 6px; margin: 12px 0; font-weight: 700; }
    .field input, .field select, .field textarea { font-weight: 400; }
    .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ma-color-border, #dce2ec); border-radius: 999px; padding: 8px 12px; margin: 4px 4px 0 0; min-height: 48px; }
    .member-input-hint { flex-basis: 100%; }
    .member-batch-list {
      border: 0; padding: 0; margin: 12px 0;
      display: grid; gap: 8px; max-height: 46vh; overflow: auto;
    }
    .member-batch-list legend { font-weight: 800; margin-bottom: 8px; }
    .member-batch-option {
      display: flex; align-items: center; gap: 10px; min-height: 52px;
      border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-control, 12px);
      padding: 8px 12px; background: var(--ma-color-surface, #fff); cursor: pointer;
    }
    .member-batch-option input { min-height: 24px; width: 24px; flex: none; }
    .member-batch-copy { display: grid; min-width: 0; }
    .people-strip { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 16px; }
    .person-chip {
      position: relative; display: inline-flex; align-items: center; gap: 7px;
      min-height: 44px; padding: 8px 12px; border: 1px solid var(--ma-color-border, #dce2ec);
      border-radius: 999px; background: var(--ma-color-surface, #fff); font-weight: 700;
      transform-origin: center; transition:
        transform var(--ma-duration-standard, 200ms) ease,
        background var(--ma-duration-standard, 200ms) ease,
        border-color var(--ma-duration-standard, 200ms) ease,
        box-shadow var(--ma-duration-standard, 200ms) ease,
        opacity var(--ma-duration-standard, 200ms) ease;
    }
    .person-chip.is-new { animation: person-enter var(--ma-duration-emphasized, 300ms) ease both; }
    .person-chip.is-active {
      background: var(--ma-color-action-soft, #e8eaff); border-color: var(--ma-color-action, #5865f2);
      transform: translateY(-2px) scale(1.035);
      box-shadow: 0 0 0 3px var(--ma-color-action-soft, #e8eaff);
    }
    .person-chip.is-fading { opacity: .7; transform: scale(.98); }
    .person-avatar {
      width: 28px; height: 28px; border-radius: 50%; display: inline-grid;
      place-items: center; background: var(--ma-color-canvas, #f4f7fb); color: var(--ma-color-text, #162033);
      font-size: 12px; font-weight: 800;
    }
    .person-chip.is-active .person-avatar { background: var(--ma-color-action, #5865f2); color: var(--ma-color-on-action, #fff); }
    .person-role { font-size: 11px; color: var(--ma-color-text-muted, #657085); font-weight: 600; }
    .people-add {
      min-height: 48px; min-width: 48px; border-radius: 999px;
      border: 1px dashed var(--ma-color-border, #dce2ec); background: var(--ma-color-surface, #fff);
      color: var(--ma-color-action, #5865f2); font: inherit; font-weight: 800; cursor: pointer;
    }
    .expense-composer {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px; align-items: stretch; margin: 12px 0;
    }
    .expense-composer input { width: 100%; min-width: 0; }
    .expense-composer .btn { white-space: nowrap; }
    .cta-rail {
      display: grid; grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px; margin: 16px 0;
    }
    .cta-card {
      min-width: 0; min-height: 64px; text-align: left; border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-surface, 14px);
      padding: 14px; background: var(--ma-color-surface, #fff); cursor: pointer;
      overflow-wrap: anywhere;
      transition: transform var(--ma-duration-feedback, 100ms) ease, border-color var(--ma-duration-feedback, 100ms) ease;
    }
    .cta-card:hover { transform: translateY(-1px); border-color: var(--ma-color-action, #5865f2); }
    .cta-title { display: block; font-size: 16px; font-weight: 800; margin-bottom: 2px; }
    .cta-desc { display: block; font-size: 14px; color: var(--ma-color-text-muted, #657085); }
    .settle-hero {
      border: 1px solid var(--ma-color-action, #5865f2); background: var(--ma-color-action-soft, #e8eaff);
      border-radius: var(--ma-radius-surface, 16px); padding: 16px; margin: 12px 0;
    }
    .settle-count { font-weight: 800; font-size: 18px; margin: 0 0 4px; }
    .account-editor {
      border-top: 1px solid var(--ma-color-border, #dce2ec); margin-top: 8px; padding-top: 12px;
    }
    .recipient-settlements { display: grid; gap: 14px; margin-top: 12px; }
    .recipient-settlement {
      border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-surface, 16px);
      padding: 14px; background: var(--ma-color-surface, #fff);
    }
    .recipient-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; padding-bottom: 8px;
    }
    .recipient-head > div { display: grid; gap: 2px; min-width: 0; }
    .recipient-account { margin: 0 0 10px; }
    .recipient-transfers { margin-top: 10px; }
    .recipient-transfers .transfer {
      border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-control, 12px);
      padding: 10px; background: var(--ma-color-canvas, #f4f7fb);
    }
    .transfer-payment:empty { display: none; }
    @keyframes person-enter {
      from { opacity: 0; transform: translateY(8px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .chip input { min-height: 24px; width: 24px; }
    .quoted { background: var(--ma-color-canvas, #f4f7fb); border-radius: var(--ma-radius-control, 12px); padding: 10px 12px; }
    .accts { display: grid; gap: 0; }
    .acct { border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-control, 12px); padding: 12px; margin-top: 12px; }
    .acct-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill { background: var(--ma-color-action-soft, #e8eaff); color: var(--ma-color-action, #5865f2); border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
    .pill-warn { background: var(--ma-color-surface-raised, #fff); color: var(--ma-color-warning, #9a5b00); border: 1px solid var(--ma-color-warning, #9a5b00); }
    .manual { margin-top: 8px; border-top: 1px solid var(--ma-color-border, #dce2ec); padding-top: 8px; }
    .transfer { border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-control, 12px); padding: 12px; display: grid; gap: 8px; }
    .transfer-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    [data-sign="pos"] { color: var(--ma-color-success, #16794b); }
    [data-sign="neg"] { color: var(--ma-color-danger, #c2353f); }
    .qr-ph { border: 2px dashed var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-control, 12px); min-height: 120px; display: grid; place-content: center; gap: 4px; text-align: center; color: var(--ma-color-text-muted, #657085); }
    .vietqr-image {
      display: block; width: min(240px, 100%); height: auto; aspect-ratio: 1 / 1;
      object-fit: contain; margin: 4px auto; border-radius: var(--ma-radius-control, 12px);
      background: #fff; border: 1px solid var(--ma-color-border, #dce2ec);
    }
    .camera-overlay {
      position: fixed; inset: 0; z-index: 1200; display: grid; place-items: center;
      padding: 16px; background: rgba(12, 18, 28, .86);
    }
    .camera-card {
      width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto;
      display: grid; gap: 12px; padding: 16px; border-radius: 18px;
      background: var(--ma-color-surface, #fff); color: var(--ma-color-text, #162033);
    }
    .camera-frame {
      position: relative; width: 100%; overflow: hidden; border-radius: 16px;
      background: #000; aspect-ratio: 1 / 1;
    }
    .camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .camera-guide {
      position: absolute; inset: 12%; border: 3px solid rgba(255,255,255,.92);
      border-radius: 18px; box-shadow: 0 0 0 999px rgba(0,0,0,.18);
      pointer-events: none;
    }
    .camera-cancel { width: 100%; }
    .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .offline-banner { background: var(--ma-color-surface-raised, #fff); border: 1px solid var(--ma-color-warning, #9a5b00); color: var(--ma-color-warning, #9a5b00); border-radius: var(--ma-radius-control, 12px); padding: 10px 12px; font-weight: 700; margin: 12px 0; }
    /* Mode chrome: website shows footer + upload affordances; the mini-app
       bundle never renders them (host owns trusted chrome). */
    .web-only { display: none; }
    html[data-mode="web"] .web-only { display: revert; }
    html[data-mode="web"] .web-only.web-block { display: block; }
    html[data-mode="web"] .web-only.web-flex { display: flex; }
    .site-footer {
      border-top: 1px solid var(--ma-color-border, #dce2ec); background: var(--ma-color-surface, #fff);
      padding: 20px 16px 40px; color: var(--ma-color-text-muted, #657085); font-size: 13px;
    }
    .site-footer-inner { max-width: 1120px; margin: 0 auto; display: grid; gap: 6px; }
    .tracking-consent { position: fixed; z-index: 30; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 720px; margin: 0 auto; padding: 16px; border: 1px solid var(--ma-color-border, #dce2ec); border-radius: var(--ma-radius-surface, 16px); background: var(--ma-color-surface-raised, #fff); color: var(--ma-color-text, #162033); }
    .tracking-consent p { margin: 6px 0 12px; }
    .tracking-consent-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0ms !important; animation-duration: 0ms !important; scroll-behavior: auto !important; }
    }
    @media (max-width: 430px) {
      .topbar-inner { flex-wrap: wrap; gap: 8px; }
      .brand { flex: 1 0 100%; }
      .brand h1 { white-space: nowrap; }
      .brand p { max-width: 28rem; }
      #net-badge { margin-right: auto; }
      .expense-composer { grid-template-columns: 1fr; }
      .expense-composer .btn { width: 100%; }
      .cta-rail { grid-template-columns: 1fr; }
      .list-row { align-items: flex-start; }
      .item-actions { flex-direction: column; }
    }
    @media (min-width: 560px) {
      .sheet-overlay { align-items: center; padding: 24px; }
      .sheet { border-radius: var(--ma-radius-surface, 20px); }
    }
    /* Desktop: sidebar steps + multi-column content. Same DOM, no fork. */
    @media (min-width: 900px) {
      .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
      .steps { grid-template-columns: 1fr; position: sticky; top: 76px; }
      .step { flex-direction: row; justify-content: flex-start; padding: 10px 12px; gap: 10px; }
      .step-n {
        width: 28px; height: 28px; border-radius: 999px; flex: none;
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--ma-color-canvas, #f4f7fb); color: var(--ma-color-text-muted, #657085);
      }
      .step.is-active .step-n { background: var(--ma-color-action, #5865f2); color: var(--ma-color-on-action, #fff); }
      .accts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; align-items: start; }
      .transfers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1 id="app-title">Chia tiền</h1>
        <p id="app-tagline">Chia tiền ăn uống — offline, lưu nháp tự động.</p>
      </div>
      <span class="badge" id="net-badge" data-online="true">Online</span>
      <span id="account-slot" hidden></span>
      <button class="btn btn-ghost btn-small" id="lang-toggle" type="button" aria-label="Language / Ngôn ngữ">VI · EN</button>
    </div>
  </header>

  <main id="main">
    <div class="offline-banner" id="offline-banner" hidden></div>
    <div class="layout">
      <nav class="steps" id="steps" aria-label="Split bill steps"></nav>
      <div class="content">
        <p class="muted" id="step-hint"></p>
        <div id="status-region" aria-live="polite"></div>
        <div id="step-body">
          <!-- Fast first paint: static skeleton ships in HTML, replaced on boot. -->
          <div class="skeleton" role="status" aria-label="Đang tải">
            <div class="sk-line"></div>
            <div class="sk-line"></div>
            <div class="sk-line"></div>
          </div>
        </div>
        <div class="foot">
          <span class="badge" id="persist-badge" data-mode="memory">…</span>
          <span class="badge web-only" id="cloud-badge" hidden></span>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer web-only web-block">
    <div class="site-footer-inner">
      <strong id="footer-title">Chia tiền · Split Bill</strong>
      <span id="footer-note">Chạy độc lập trên web: nháp lưu trên trình duyệt này, danh sách ngân hàng tải trực tiếp. Trong mobile app, cùng bundle chạy qua host bridge (không storage web, không network trực tiếp).</span>
    </div>
  </footer>

  <aside class="tracking-consent web-only" id="tracking-consent" hidden aria-labelledby="tracking-consent-title">
    <strong id="tracking-consent-title"></strong>
    <p class="muted" id="tracking-consent-body"></p>
